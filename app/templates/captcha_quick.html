<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>输入验证码</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 24px; width: 100%; max-width: 360px; }
    .title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .desc { font-size: 14px; color: #6b7280; text-align: center; margin-bottom: 24px; }
    .input { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 12px 16px; font-size: 24px; letter-spacing: 8px; text-align: center; outline: none; }
    .input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.3); }
    .btn { width: 100%; background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 18px; margin-top: 16px; cursor: pointer; }
    .btn:disabled { opacity: .6; }
    .result { text-align: center; padding: 16px 0; }
    .icon { font-size: 48px; margin-bottom: 12px; }
    .icon-ok { color: #22c55e; }
    .icon-fail { color: #ef4444; }
    .msg { font-size: 18px; font-weight: 500; }
    .hint { font-size: 13px; color: #9ca3af; margin-top: 8px; }
    .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">企微IP管理</div>
        <div class="desc">请输入收到的短信验证码</div>

        <div id="form-section">
            <form id="captcha-form">
                <input type="text" name="captcha_code" id="captcha-input" maxlength="6"
                    placeholder="请输入6位验证码" class="input" required inputmode="numeric" autocomplete="one-time-code">
                <button type="submit" id="submit-btn" class="btn">提交验证码</button>
            </form>
        </div>

        <div id="result-section" class="hidden result">
            <div id="result-icon" class="icon"></div>
            <div id="result-text" class="msg"></div>
            <p id="result-hint" class="hint"></p>
        </div>
    </div>

    <script>
    document.getElementById('captcha-input').focus();

    document.getElementById('captcha-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var input = document.getElementById('captcha-input');
        var btn = document.getElementById('submit-btn');
        var code = input.value.trim();
        if (!code) return;

        btn.disabled = true;
        btn.textContent = '提交中...';

        fetch('/console/submit-captcha-quick', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'captcha_code=' + encodeURIComponent(code)
        }).then(function(r) {
            if (r.status === 401) {
                showResult('fail', '链接已失效', '请从新通知中的链接重新打开');
                return null;
            }
            return r.json();
        }).then(function(data) {
            if (!data) return;
            if (data.ok) {
                showResult('success', '验证码已提交', '系统正在处理，请稍候...');
            } else {
                showResult('fail', data.message, '请重试');
            }
        }).catch(function() {
            showResult('fail', '提交失败', '请检查网络后重试');
        });
    });

    function showResult(type, text, hint) {
        document.getElementById('form-section').classList.add('hidden');
        var section = document.getElementById('result-section');
        section.classList.remove('hidden');
        document.getElementById('result-icon').textContent = type === 'success' ? '\u2713' : '\u2717';
        document.getElementById('result-icon').className = 'icon ' + (type === 'success' ? 'icon-ok' : 'icon-fail');
        document.getElementById('result-text').textContent = text;
        document.getElementById('result-hint').textContent = hint;
    }
    </script>
</body>
</html>
