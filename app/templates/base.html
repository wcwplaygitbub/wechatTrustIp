<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}控制台{% endblock %} - 企微IP管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow mb-6">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/console/" class="text-lg font-bold text-gray-800">企微IP管理</a>
            <div class="flex items-center gap-4">
                <a href="/console/" class="text-gray-600 hover:text-gray-900">状态</a>
                <a href="/console/logs" class="text-gray-600 hover:text-gray-900">日志</a>
                <a href="/console/config" class="text-gray-600 hover:text-gray-900">配置</a>
                <a href="/console/password" class="text-gray-600 hover:text-gray-900">修改密码</a>
                <a href="/console/logout" class="text-red-500 hover:text-red-700">退出</a>
            </div>
        </div>
    </nav>
    <div class="max-w-6xl mx-auto px-4">
        {% block content %}{% endblock %}
    </div>
    {% if toast %}
    <div id="toast" class="fixed bottom-6 right-6 px-4 py-2 rounded shadow-lg text-white
        {% if toast_type == 'error' %}bg-red-500{% else %}bg-green-500{% endif %}">
        {{ toast }}
    </div>
    <script>setTimeout(() => document.getElementById('toast').remove(), 3000)</script>
    {% endif %}
</body>
</html>
