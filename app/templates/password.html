{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<h2 class="text-xl font-bold mb-4">修改密码</h2>
<div class="bg-white rounded-lg shadow p-6 max-w-md">
    {% if error %}
    <div class="bg-red-100 text-red-700 px-3 py-2 rounded mb-4 text-sm">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="bg-green-100 text-green-700 px-3 py-2 rounded mb-4 text-sm">{{ success }}</div>
    {% endif %}
    <form method="post" action="/console/password" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">当前密码</label>
            <input type="password" name="old_password" required
                class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">新密码</label>
            <input type="password" name="new_password" required
                class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">确认新密码</label>
            <input type="password" name="confirm_password" required
                class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit"
            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
            修改密码
        </button>
    </form>
</div>
{% endblock %}
